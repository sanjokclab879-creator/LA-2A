name: Build macOS Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Universal VST3/AU and PKG
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Upload macOS Installer (.pkg)
        uses: actions/upload-artifact@v4
        with:
          name: LA2A_Clone_macOS_Installer
          path: LA2A_Clone_v1.0.0_macOS.pkg
